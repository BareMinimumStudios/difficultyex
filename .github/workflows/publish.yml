name: publish

# Never publish as a side effect of a normal build or push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/1.21.1'
    runs-on: ubuntu-latest
    name: Build and publish Minecraft 1.21.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace
      - name: Extract release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '\r')"
          test -n "$v"
          echo "number=$v+1.21.1" >> "$GITHUB_OUTPUT"
      - name: Publish Fabric
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: qdJ4GLvL
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1387673
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*-fabric-1.21.1.jar
          name: ${{ steps.version.outputs.number }}-fabric
          version: ${{ steps.version.outputs.number }}-fabric
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}
            fzzy-config(required){modrinth:VSNURh3q}
            playerex(required){modrinth:4UKlJSdk}
            data-attributes(required){modrinth:KCGxOJsE}
            remnant(required){modrinth:oLPaySSb}
          retry-attempts: 3
          fail-mode: fail
      - name: Publish NeoForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: qdJ4GLvL
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1387673
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*-neoforge-1.21.1.jar
          name: ${{ steps.version.outputs.number }}-neoforge
          version: ${{ steps.version.outputs.number }}-neoforge
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            kotlin-for-forge(required){modrinth:kotlin-for-forge}
            fzzy-config(required){modrinth:VSNURh3q}
            playerex(required){modrinth:4UKlJSdk}
            data-attributes(required){modrinth:KCGxOJsE}
            remnant(required){modrinth:oLPaySSb}
          retry-attempts: 3
          fail-mode: fail
