name: publish

# Never publish as a side effect of a normal build or push.
on:
  workflow_dispatch:

concurrency:
  group: difficultyex-publish-1.21.1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/1.21.1'
    runs-on: ubuntu-latest
    name: Build and publish Minecraft 1.21.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Check publishing credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo '::error::MODRINTH_TOKEN is missing'; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo '::error::CURSEFORGE_TOKEN is missing'; exit 1; }
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --stacktrace
      - name: Check release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for loader in fabric neoforge; do
            files=(build/libs/*-"$loader"-1.21.1.jar)
            test "${#files[@]}" -eq 1 || { echo "::error::Expected one $loader release JAR"; exit 1; }
            test -s "${files[0]}"
          done
      - name: Extract release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '\r')"
          test -n "$v"
          echo "number=$v+1.21.1" >> "$GITHUB_OUTPUT"
      - name: Publish Fabric
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: qdJ4GLvL
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1387673
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*-fabric-1.21.1.jar
          name: ${{ steps.version.outputs.number }}-fabric
          version: ${{ steps.version.outputs.number }}-fabric
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}{curseforge:308769}
            fzzy-config(required){modrinth:VSNURh3q}{curseforge:1005914}
            playerex(required){modrinth:4UKlJSdk}{curseforge:958325}
            data-attributes(required){modrinth:KCGxOJsE}{curseforge:955929}
            remnant(required){modrinth:oLPaySSb}{curseforge:1019391}
          retry-attempts: 3
          fail-mode: fail
      - name: Publish NeoForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: qdJ4GLvL
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1387673
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/*-neoforge-1.21.1.jar
          name: ${{ steps.version.outputs.number }}-neoforge
          version: ${{ steps.version.outputs.number }}-neoforge
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            kotlin-for-forge(required){modrinth:kotlin-for-forge}{curseforge:351264}
            fzzy-config(required){modrinth:VSNURh3q}{curseforge:1005914}
            playerex(required){modrinth:4UKlJSdk}{curseforge:958325}
            data-attributes(required){modrinth:KCGxOJsE}{curseforge:955929}
            remnant(required){modrinth:oLPaySSb}{curseforge:1019391}
          retry-attempts: 3
          fail-mode: fail
